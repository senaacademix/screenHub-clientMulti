[package]
name = "screenhub-client"
version = "1.0.0"
description = "Cliente Digital Signage Kiosco en Tauri v2"
authors = ["ScreenHub"]
edition = "2021"

[lib]
name = "screenhub_client"
path = "src/lib.rs"

[[bin]]
name = "screenhub-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
